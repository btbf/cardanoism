version: title-0.1

titles:
  - id: general_name
    source: "[GENERAL] Name and surname of main applicant"
    target_ja: "[一般] 主申請者の氏名と姓"

  - id: general_delivery_entity
    source: "[GENERAL] Are you delivering this project as an individual or as an entity (whether formally incorporated or not)"
    target_ja: "[一般] このプロジェクトは個人として実施しますか、組織として実施しますか"

  - id: general_requested_funds
    source: "[GENERAL] Requested funds in ada"
    target_ja: "[一般] 必要な資金額をADAで記入してください"

  - id: general_duration_months
    source: "[GENERAL] Please specify how many months you expect your project to last (from 2-12 months)"
    target_ja: "[一般] 想定するプロジェクト期間の月数を記入してください 2-12カ月"

  - id: general_auto_translated
    source: "[GENERAL] Please indicate if your proposal has been auto-translated into English from another language"
    target_ja: "[一般] この提案は他言語から英語に自動翻訳されていますか"

  - id: general_solution_summary
    source: "[GENERAL] Summarize your solution to the problem (200-character limit including spaces)"
    target_ja: "[一般] 問題に対する解決策の要約 200字以内"

  - id: general_dependencies
    source: "[GENERAL] Does your project have any dependencies on other organizations, technical or otherwise?"
    target_ja: "[一般] このプロジェクトは他組織に依存していますか 技術面を含む"

  - id: general_dependencies_detail
    source: "[GENERAL] If YES, please describe what the dependency is and why you believe it is essential for your project’s delivery. If NO, please write “No dependencies.”"
    target_ja: "[一般] 依存がある場合は内容と必要性 ない場合は No dependencies と記入してください"

  - id: general_open_source
    source: "[GENERAL] Will your project’s output/s be fully open source?"
    target_ja: "[一般] このプロジェクトの成果物は完全にオープンソースですか"

  - id: general_open_source_detail
    source: "[GENERAL] Please provide here more information on the open source status of your project outputs"
    target_ja: "[一般] オープンソース状況の詳細を記入してください"

  - id: metadata_sdg
    source: "[METADATA] SDG rating"
    target_ja: "[メタデータ] SDG評価"

  - id: solution_detail
    source: "[SOLUTION] Please describe your proposed solution"
    target_ja: "[解決策] 提案する解決策を説明してください"

  - id: impact_detail
    source: "[IMPACT] Please define the positive impact your project will have on the wider Cardano community"
    target_ja: "[影響] Cardanoコミュニティに与える良い影響を説明してください"

  - id: capability_feasibility
    source: "[CAPABILITY & FEASIBILITY] What is your capability to deliver your project with high levels of trust and accountability? How do you intend to validate if your approach is feasible?"
    target_ja: "[能力と実現性] 信頼性と説明責任のもとでの実行能力と実現性の検証方法を説明してください"

  - id: project_milestones
    source: "[PROJECT MILESTONES] What are the key milestones you need to achieve in order to complete your project successfully?"
    target_ja: "[マイルストーン] 主要マイルストーンを教えてください"

  - id: resources_team
    source: "[RESOURCES] Who is in the project team and what are their roles?"
    target_ja: "[リソース] チーム構成と各メンバーの役割を教えてください"

  - id: budget_costs
    source: "[BUDGET & COSTS] Please provide a cost breakdown of the proposed work and resources"
    target_ja: "[予算と費用] コスト内訳を記入してください"

  - id: value_for_money
    source: "[VALUE FOR MONEY] How does the cost of the project represent value for money for the Cardano ecosystem?"
    target_ja: "[費用対効果] このコストがCardanoエコシステムにとって妥当である理由を説明してください"

